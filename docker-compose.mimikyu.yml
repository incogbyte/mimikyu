services:
  origin:
    build:
      context: ./tests/e2e
    expose:
      - 8080
    ports:
      - 127.0.0.1:18081:8080
    healthcheck:
      test:
        ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:8080/navigation', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s

  chrome:
    build:
      context: ./docker/chrome
    platform: linux/amd64
    mem_limit: 2g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mimikyu_chrome_profile:/home/chromeuser/profile
    environment:
      PORT: 3003
      CHROME_CONTROL_PORT: 9223
      ENABLE_GUI_CONTROL: "true"
      XPRA_PORT: 14111
      CHROME_SCREEN_WIDTH: 1920
      CHROME_SCREEN_HEIGHT: 1080
      CHROME_PROXY_SERVER: ""
      CHROME_PROXY_ENABLE_DNS: "false"
      CHROME_PROXY_DNS_EXCLUSIONS: "localhost"
      CHROME_PROFILE_RECOVERY: "true"
    ports:
      - 127.0.0.1:14111:14111
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3003/json/version >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  agent:
    build:
      context: ./agent
    depends_on:
      chrome:
        condition: service_healthy
      origin:
        condition: service_healthy
    ports:
      - 127.0.0.1:38427:38427
    environment:
      MIMIKYU_AGENT_HOST: 0.0.0.0
      MIMIKYU_AGENT_PORT: 38427
      MIMIKYU_TOKEN: "change-this-development-token"
      MIMIKYU_MAX_TARGETS: 8
      CHROME_DEBUGGING_HOST: chrome
      CHROME_DEBUGGING_PORT: 3003
    healthcheck:
      test:
        ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:38427/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  mimikyu_chrome_profile:
